<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CatChat</title>
<style>
:root{--bg:#f5f2ff;--panel:#fff;--ink:#1d1a33;--mute:#6b678a;--line:#e0dbf5;--coin:#e8a400;--accent:#0f9d73;--danger:#d64550;--me:#e6e0ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
:root:not([data-theme="light"]){}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12142a;--panel:#1b1e3a;--ink:#f1eeff;--mute:#9a97c4;--line:#2d3160;--coin:#ffc93c;--accent:#5be3b0;--danger:#ff7b84;--me:#2a2f66;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12142a;--panel:#1b1e3a;--ink:#f1eeff;--mute:#9a97c4;--line:#2d3160;--coin:#ffc93c;--accent:#5be3b0;--danger:#ff7b84;--me:#2a2f66;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.45 ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:.5em .9em;background:var(--accent);color:#07241b;font-weight:600}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
button.bad{background:var(--danger);color:#fff}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.55em .75em;width:100%}
#login{height:100%;display:grid;place-items:center;padding:1rem}
#login form{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:1.6rem;width:min(380px,100%);display:grid;gap:.8rem}
#login h1{margin:0;font-size:1.9rem}
#login p{margin:0;color:var(--mute)}
#err{color:var(--danger);min-height:1.3em;font-size:.9rem}
#app{height:100%;display:none;flex-direction:column}
header{display:flex;align-items:center;gap:.8rem;padding:.6rem 1rem;border-bottom:1px solid var(--line);background:var(--panel)}
header b{font-size:1.15rem;flex:1}
.coins{color:var(--coin);font-weight:600;white-space:nowrap}
nav{display:flex;gap:.4rem;padding:.5rem 1rem;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:transparent;color:var(--mute);border:1px solid transparent}
nav button.on{background:var(--panel);color:var(--ink);border-color:var(--line)}
main{flex:1;min-height:0;display:flex;justify-content:center}
.pane{display:none;min-height:0;flex:1;max-width:760px;width:100%}
#log{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.45rem}
.m{max-width:85%;padding:.45rem .75rem;border-radius:14px;background:var(--panel);border:1px solid var(--line);overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--me)}
.m .n{font-weight:600;font-size:.85rem;color:var(--accent)}
.m .x{background:none;color:var(--danger);padding:0 .3em;margin-left:.3em}
.sys{align-self:center;color:var(--mute);font-size:.88rem;text-align:center}
#send{display:flex;gap:.5rem;padding:.7rem 1rem;border-top:1px solid var(--line)}
.scroll{overflow-y:auto;padding:1rem;gap:.7rem;align-content:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.8rem;display:flex;gap:.8rem;align-items:center}
.card .e{font-size:2rem}.card .i{flex:1;min-width:0}.card small{color:var(--mute);display:block}
.price{color:var(--coin);font-weight:600}
h2{margin:.2rem 0;font-size:1.05rem}
.row{display:flex;gap:.5rem;flex-wrap:wrap}.row>*{flex:1;min-width:90px}
.empty{color:var(--mute);padding:1rem;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.5em 1em;border-radius:10px;display:none;z-index:9}
.tag{font-size:.75rem;background:var(--coin);color:#2b1d00;border-radius:6px;padding:0 .4em;margin-left:.3em}
body[data-tab=chat] #p-chat{display:flex;flex-direction:column}
body[data-tab=shop] #p-shop,body[data-tab=wallet] #p-wallet,body[data-tab=settings] #p-settings,body[data-tab=admin] #p-admin,body[data-tab=apps][data-app=home] #p-home,body[data-tab=apps][data-app=arcade] #p-arcade,body[data-tab=apps][data-app=news] #p-news,body[data-tab=apps][data-app=battle] #p-battle,body[data-tab=apps][data-app=trade] #p-trade{display:grid}
.mw{display:flex;gap:.5rem;align-items:flex-end;max-width:92%}
.mw.me{align-self:flex-end;flex-direction:row-reverse}
.av{width:36px;height:36px;border-radius:50%;flex:none;background:var(--line);object-fit:cover;overflow:visible}
.av.big{width:104px;height:104px}
.noav .mw .avw{display:none}
.avw{position:relative;display:inline-block;flex:none;line-height:0}
.dot{position:absolute;right:0;bottom:0;width:28%;height:28%;min-width:9px;min-height:9px;border-radius:50%;background:#2ecc71;border:2px solid var(--panel)}
.big-bal{font-size:2.5rem;font-weight:600;color:var(--coin);line-height:1.1}
.set{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.9rem;display:grid;gap:.6rem}
.sw,.seg{display:flex;gap:.45rem;flex-wrap:wrap}
.sw button{width:32px;height:32px;padding:0;border-radius:50%;border:2px solid var(--line)}
.sw button.on,.seg button.on{outline:2px solid var(--accent);outline-offset:2px}
.seg button{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.set label.t{display:flex;gap:.6rem;align-items:center}
.set input[type=checkbox]{width:auto}
select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.55em .75em;width:100%;color:inherit;font:inherit}
.ico{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--line);flex:none}
.row>.ico{flex:none;min-width:0}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px}
#cv{width:240px;height:240px;border:1px solid var(--line);touch-action:none;background:#fff;border-radius:10px;display:block;margin-bottom:.5rem}
.fi{position:relative;text-align:center;flex:1;min-width:0}
.fi>img,.noimg{width:min(38vw,150px);height:min(38vw,150px);object-fit:cover;border-radius:14px;background:var(--line);display:grid;place-items:center;font-size:3rem;margin:.3rem auto}
.hp{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.hp i{display:block;height:100%;background:var(--accent);transition:width .5s}
.fx{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center;font-size:3.2rem}
@keyframes pop{0%{transform:scale(.2) rotate(0);opacity:0}30%{opacity:1}100%{transform:scale(1.8) rotate(40deg);opacity:0}}
@keyframes cut{0%{transform:scaleX(0) rotate(-35deg);opacity:1}50%{transform:scaleX(1) rotate(-35deg);opacity:1}100%{transform:scaleX(1) rotate(-35deg);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.fx.fire::after{content:"🔥"}.fx.water::after{content:"💧"}.fx.bolt::after{content:"⚡"}.fx.star::after{content:"⭐"}
.fx.fire::after,.fx.water::after,.fx.bolt::after,.fx.star::after{animation:pop .9s ease-out}
.fx.slash::after,.fx.claw::after{content:"";display:block;width:80%;height:5px;background:#fff;box-shadow:0 0 8px #000;border-radius:3px;animation:cut .6s ease-out}
.fx.claw::after{box-shadow:0 -16px 0 #fff,0 16px 0 #fff,0 0 8px #000}
.hit>img,.hit>.noimg{animation:shake .45s}
.fx img{width:80%;height:80%;object-fit:contain}
.stage{position:relative;width:240px;height:240px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/20px 20px;margin:.5rem 0}
.stage>*{position:absolute;inset:0;width:100%;height:100%}
#onion{opacity:.3;pointer-events:none}
#acv{touch-action:none}
.apv,.th img{background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/12px 12px;border:1px solid var(--line);border-radius:8px}
.apv{width:110px;height:110px;object-fit:contain}
.strip{display:flex;gap:.5rem;overflow-x:auto;padding:.3rem 0}
.th{position:relative;flex:none}.th img{width:56px;height:56px}
.th button{position:absolute;top:-4px;right:-4px;width:20px;height:20px;padding:0;border-radius:50%;font-size:.7rem;background:var(--danger);color:#fff}
#adlg{width:min(340px,94vw)}
#pop{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:10;display:grid;gap:.5rem;padding:.5rem;justify-items:center;pointer-events:none}
#pop .pp{pointer-events:auto;background:var(--panel);border:2px solid var(--accent);border-radius:14px;padding:.7rem .9rem;box-shadow:0 6px 24px rgba(0,0,0,.3);width:min(520px,100%);display:grid;gap:.5rem}
.rar{font-size:.72rem;border-radius:6px;padding:0 .4em;margin-left:.3em;color:#fff;text-transform:capitalize;white-space:nowrap}
.r-common{background:#8a87ab}.r-uncommon{background:#1fa463}.r-rare{background:#2f7fd6}.r-epic{background:#8e5bd9}.r-legendary{background:#e8a400;color:#2b1d00}
.tm{display:flex;justify-content:center;gap:2px;font-size:.8rem}.tm .dn{opacity:.25;filter:grayscale(1)}.tm .cu{outline:2px solid var(--accent);border-radius:50%}
#mkbody{display:grid;gap:.5rem}
nav[hidden]{display:none}
#subnav{background:var(--bg)}
#p-chat{position:relative}
#p-chat.drag{outline:3px dashed var(--accent);outline-offset:-6px}
#p-chat.drag::after{content:"Drop a picture to send it 🐾";position:absolute;inset:0;display:grid;place-items:center;font-weight:600;background:color-mix(in srgb,var(--bg) 75%,transparent);pointer-events:none}
.mi{display:block;max-width:min(260px,100%);max-height:260px;border-radius:10px;margin-top:.3rem;background:var(--line)}
#pend{display:flex;gap:.5rem;align-items:center;padding:.5rem 1rem 0}
#pend[hidden]{display:none}
#pend img{width:56px;height:56px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.clip{display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;padding:0 .7em;cursor:pointer;background:var(--panel)}
.news{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.9rem;display:grid;gap:.6rem}
.news .nt{white-space:pre-wrap;overflow-wrap:anywhere}
.news .nimg{max-width:100%;max-height:420px;border-radius:10px;object-fit:contain;display:inline-block}
.news .nd{color:var(--mute);font-size:.85rem;display:flex;gap:.6rem;align-items:center}
.news .nd span{flex:1}
#nf.drag{outline:3px dashed var(--accent)}
textarea{resize:vertical}
.bh{margin:0;font-size:1.3rem}
.bp{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.bl{display:inline-block;padding:.5em .9em;border-radius:10px;background:var(--accent);color:#07241b;font-weight:600;text-decoration:none}
.news hr,.blk hr{border:0;border-top:1px solid var(--line);width:100%;margin:.2rem 0}
.blk{border:1px solid var(--line);border-radius:12px;padding:.6rem;display:grid;gap:.5rem;background:var(--bg)}
.blk input[type=color]{padding:0;height:36px;min-width:44px;flex:none}
.fi.st-poison>img,.fi.st-poison>.noimg{filter:hue-rotate(250deg) saturate(1.5)}
.fi.st-burn>img,.fi.st-burn>.noimg{box-shadow:0 0 18px 4px #ff7a2c}
.fi.st-freeze>img,.fi.st-freeze>.noimg{filter:hue-rotate(160deg) brightness(1.15);box-shadow:0 0 14px 3px #8fe3ff}
.fi.st-sleep>img,.fi.st-sleep>.noimg{filter:brightness(.6) grayscale(.4)}
.fi.st-paralysis>img,.fi.st-paralysis>.noimg{box-shadow:0 0 16px 3px #ffd93c}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:.8rem}
.tile{aspect-ratio:1;display:grid;place-content:center;justify-items:center;gap:.2rem;padding:.4rem;border-radius:22px;background:var(--panel);color:var(--ink);border:1px solid var(--line);position:relative}
.tile span{font-size:2.6rem;line-height:1}
.tile small{font-weight:600}
.tile .bdg{position:absolute;top:8px;right:8px;background:var(--danger);color:#fff;border-radius:999px;min-width:20px;height:20px;font-size:.75rem;display:grid;place-items:center;padding:0 5px;font-style:normal}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:.4rem;justify-content:center;margin-top:.2rem}
.pad button{height:56px;font-size:1.3rem;touch-action:manipulation}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;width:min(100%,300px)}
.ttt button{aspect-ratio:1;font-size:2.4rem;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.cb{display:grid;grid-template-columns:repeat(8,1fr);width:min(100%,400px);border:2px solid var(--line);border-radius:6px;overflow:hidden}
.cb button{aspect-ratio:1;padding:0;border-radius:0;display:grid;place-items:center;font-size:min(8vw,2.3rem);position:relative}
.cb .dt{position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(15,157,115,.65)}
</style>
</head>
<body data-tab="chat" data-app="home" data-side="shop">
<div id="login"><form id="lf">
 <h1>CatChat 🐾</h1>
 <p>Pick a name to chat, earn coins and shop. Your name stays yours.</p>
 <input id="nm" placeholder="Username" maxlength="16" autocomplete="username">
 <input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
 <p style="font-size:.85rem">New name? Just pick a password and we’ll create the account.</p>
 <div id="err"></div>
 <button>Log in or sign up</button>
</form></div>

<div id="app">
 <header><b>CatChat 🐾</b><span class="coins" id="bal"></span><button class="ghost" id="out">Leave</button></header>
 <nav id="nav"></nav>
 <nav id="subnav" hidden></nav>
 <main>
  <section class="pane" id="p-chat"><div id="log"></div>
   <div id="pend" hidden><img id="pendimg" alt=""><button type="button" class="ghost" id="pendx">Remove picture</button></div>
   <form id="send"><label class="clip" title="Add a picture">📎<input type="file" id="mf" accept="image/*" hidden></label><input id="msg" placeholder="Message, /pay name 25, or drop a picture" autocomplete="off" maxlength="300"><button>Send</button></form></section>
  <section class="pane scroll" id="p-shop"></section>
  <section class="pane scroll" id="p-home"></section>
  <section class="pane scroll" id="p-news"></section>
  <section class="pane scroll" id="p-arcade"></section>
  <section class="pane scroll" id="p-battle"></section>
  <section class="pane scroll" id="p-trade"></section>
  <section class="pane scroll" id="p-wallet"></section>
  <section class="pane scroll" id="p-settings"></section>
  <section class="pane scroll" id="p-admin"></section>
 </main>
</div>
<dialog id="dlg"><canvas id="cv" width="160" height="160"></canvas><div class="sw" id="dsw" style="margin-bottom:.5rem"></div>
 <div class="row"><button type="button" class="ghost" data-d="clear">Clear</button><button type="button" class="ghost" data-d="cancel">Cancel</button><button type="button" data-d="use">Use drawing</button></div></dialog>
<dialog id="adlg"><b>Attack animation</b>
 <div class="seg" style="margin:.5rem 0"><button type="button" data-am="frames">Draw frames</button><button type="button" data-am="gif">Upload a GIF</button></div>
 <div id="a-frames"><div class="stage"><img id="onion" alt="" hidden><canvas id="acv" width="160" height="160"></canvas></div>
  <div class="sw" id="asw" style="margin-bottom:.5rem"></div>
  <label>Brush size<input type="range" id="asz" min="2" max="20" value="6"></label>
  <div class="row" style="margin:.5rem 0"><button type="button" class="ghost" data-aerase>Eraser</button><button type="button" class="ghost" data-aclr>Clear</button><button type="button" class="ghost" data-acopy>Copy last frame</button></div>
  <button type="button" data-addf style="width:100%">Add frame</button>
  <div class="strip" id="astrip"></div>
  <label>Speed (ms per frame)<input type="number" id="ams" min="50" max="500" value="120"></label></div>
 <div id="a-gif" hidden><input type="file" id="agif" accept="image/gif"><small>GIF up to 90 KB. Keep it small and short.</small></div>
 <div style="display:flex;justify-content:center;margin:.6rem 0"><img id="apv" class="apv" alt="" hidden></div>
 <div id="amsg" style="color:var(--danger);min-height:1.2em;font-size:.85rem"></div>
 <div class="row"><button type="button" class="ghost" data-apv>Preview</button><button type="button" class="ghost" data-aclose>Close</button><button type="button" data-ause>Use this</button></div></dialog>
<dialog id="mkdlg" style="width:min(380px,94vw)"><div id="mkbody"></div><div class="row" style="margin-top:.6rem"><button type="button" class="ghost" data-mkx>Close</button><button type="button" data-mkgo>Create</button></div></dialog>
<dialog id="evdlg" style="width:min(380px,94vw);max-height:90vh;overflow:auto"><div id="evbody" style="display:grid;gap:.5rem"></div><div class="row" style="margin-top:.6rem"><button type="button" class="ghost" data-evx>Close</button><button type="button" class="ghost" data-evrm>Remove evolution</button><button type="button" data-evgo>Save</button></div></dialog>
<div id="pop"></div>
<div id="toast"></div>

<script>
const ROOT="meowmaster100", $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const RAR=["common","uncommon","rare","epic","legendary"],CLS=new Set(RAR),rb=r=>r?(CLS.has(r)?`<span class="rar r-${r}">${r}</span>`:`<span class="rar" style="background:hsl(${hashStr(r)%360} 55% 40%)">${esc(r)}</span>`):"",rb2=r=>r&&r!=="common"?rb(r):"";
const odds=k=>{const ks=Object.keys(k.chances||{}).filter(r=>k.chances[r]>0),S=ks.reduce((s,r)=>s+k.chances[r],0),f=k.contents.find(c=>c.fill),lab=r=>r==="~"?'<span class="rar r-common">no rarity</span>':rb(r),n=v=>Math.round(v*10)/10;
 if(!ks.length)return f?"Always "+esc(f.name):"Equal chance for every prize";
 return ks.map(r=>`${lab(r)} ${n(100*k.chances[r]/(f?100:S))}%`).join(" ")+(f&&S<100?` · ${esc(f.name)} ${n(100-S)}%`:"")};
const giveBox=`<label style="display:flex;gap:.5rem;align-items:center"><input type="checkbox" name="give" style="width:auto">Give me one right away</label>`;
const rarSel=`<input name="rarity" list="rarlist" placeholder="Rarity (optional, type anything)" maxlength="20" autocomplete="off">`,poBox=`<label style="display:flex;gap:.5rem;align-items:center"><input type="checkbox" name="po" style="width:auto">Only in packs (not sold alone)</label>`;
let meId=null,players={},items={},cats={},moves={},packs={},msgs=[],news=[],wilds={},trainers={},tab="chat",app="home",started=false;
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const me=()=>players[meId], isAdmin=()=>!!(me()&&me().admin);
const FUR=["#f2a65a","#8d8d9b","#2f2f3a","#f4efe6","#c98a5b","#e8c9a0","#7aa7c7","#d6a6e0"],EYE=["#4cc38a","#f5c542","#4aa3ff","#ff8a5c","#b07cff"],PAT=["plain","stripes","patch","muzzle"],ACC=["none","bow","crown","glasses","hat"];
const hashStr=s=>[...s].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7);
const defAv=n=>{const h=hashStr(String(n).toLowerCase());return{mode:"cat",fur:h%FUR.length,eyes:(h>>3)%EYE.length,pat:(h>>5)%PAT.length,acc:0}};
function catSVG(a,cls){
 const f=FUR[a.fur]||FUR[0],e=EYE[a.eyes]||EYE[0],p=PAT[a.pat]||"plain",c=ACC[a.acc]||"none";
 const eye=x=>`<ellipse cx="${x}" cy="56" rx="6" ry="7" fill="${e}"/><ellipse cx="${x}" cy="56" rx="2.2" ry="5" fill="#1a1a1a"/><circle cx="${x+2}" cy="53" r="1.6" fill="#fff"/>`;

function shrink(f,max,lim){return new Promise((ok,no)=>{
 if(!f||!f.type.startsWith("image/"))return no(new Error("Choose an image file"));
 const rd=new FileReader();rd.onerror=()=>no(new Error("Couldn’t read that image"));
 rd.onload=()=>{const im=new Image();im.onerror=()=>no(new Error("Couldn’t read that image"));
  im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas"),x=c.getContext("2d");
   for(const k of[1,.75,.5])for(const q of[.8,.6,.45]){c.width=Math.max(1,Math.round(im.width*s*k));c.height=Math.max(1,Math.round(im.height*s*k));x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);const u=c.toDataURL("image/jpeg",q);if(u.length<lim)return ok(u)}
   no(new Error("That picture is too detailed"))};
  im.src=rd.result};rd.readAsDataURL(f)})}

  else if(d.restore){const[t,id]=d.restore.split(":");await api("shop/restore",{kind:t,id})}
  else if(d.rmmove)await api("move/remove",{id:d.rmmove});

  else if(d.pdel){const[k,id]=d.pdel.split(":");if(confirm("Delete this forever? Players who own it will lose it too. This can’t be undone."))await api("shop/delete",{kind:k,id})}
  else if(d.rmwild)await api("wild/remove",{id:d.rmwild});
  else if(d.rmtrainer)await api("trainer/remove",{id:d.rmtrainer});
  else if("pvbtn" in d)play("__pv",document.querySelector("#mf [name=anim]").value,afx);
  else if("afxopen" in d){$("#adlg").showModal();renderA()}

function gSnake(box,setS){
 const N=20,C=18,cv=document.createElement("canvas");cv.width=cv.height=N*C;
 cv.style.cssText="width:min(100%,360px);border:1px solid var(--line);border-radius:10px;touch-action:none;background:var(--bg)";

 const reset=()=>{s=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];d=nd={x:1,y:0};score=0;dead=false;place();info()};
 const draw=()=>{x.clearRect(0,0,cv.width,cv.height);x.fillStyle="#e8602c";x.fillRect(f.x*C+2,f.y*C+2,C-4,C-4);
  s.forEach((p,i)=>{x.fillStyle=i?"#0f9d73":"#5be3b0";x.fillRect(p.x*C+1,p.y*C+1,C-2,C-2)});

 const step=()=>{if(dead)return;d=nd;const h={x:s[0].x+d.x,y:s[0].y+d.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||s.some(p=>p.x===h.x&&p.y===h.y)){dead=true;info();draw();return}

 const loop=()=>{step();t=setTimeout(loop,Math.max(60,130-score*3))};
 const DIR={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}};
 gkey=k=>{if(dead&&(DIR[k]||k==="tap")){reset();draw();return}const m=DIR[k];if(m&&(m.x!==-d.x||m.y!==-d.y))nd=m};

function gTetris(box,setS){
 const W=10,H=20,C=24,cv=document.createElement("canvas");cv.width=W*C;cv.height=H*C;
 cv.style.cssText="width:min(60vw,240px);border:1px solid var(--line);border-radius:10px;background:var(--bg)";
 box.append(cv);box.insertAdjacentHTML("beforeend",pad([["ArrowLeft","◀"],["ArrowUp","⟳"],["ArrowRight","▶"],null,["ArrowDown","▼"],[" ","⏬"]]));
 const ctx=cv.getContext("2d");
 const TP={I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]},
  TC={I:"#58c6d1",O:"#e8c000",T:"#a040a0",S:"#4caf50",Z:"#e8602c",J:"#4a8de8",L:"#e89a2c"};
 let g,p,score,lines,dead,t;
 const rot=m=>m[0].map((_,i)=>m.map(r=>r[i]).reverse());
 const fit=(m,px,py)=>m.every((r,y)=>r.every((v,xx)=>!v||(px+xx>=0&&px+xx<W&&py+y<H&&(py+y<0||!g[py+y][px+xx]))));
 const spawn=()=>{const k="IOTSZJL"[Math.floor(Math.random()*7)];p={k,m:TP[k].map(r=>[...r]),x:Math.floor((W-TP[k][0].length)/2),y:0};if(!fit(p.m,p.x,p.y))dead=true};
 const info=()=>setS(`Score ${score} · Lines ${lines} · Best ${bestOf("tetris",score)}`);
 const lock=()=>{p.m.forEach((r,y)=>r.forEach((v,xx)=>{if(v)g[p.y+y][p.x+xx]=p.k}));let n=0;
  for(let y=H-1;y>=0;y--)if(g[y].every(Boolean)){g.splice(y,1);g.unshift(Array(W).fill(0));n++;y++}
  if(n){lines+=n;score+=[0,100,300,500,800][n]}spawn()};
 const cell=(cx,cy,k)=>{ctx.fillStyle=TC[k];ctx.fillRect(cx*C+1,cy*C+1,C-2,C-2)};
 const draw=()=>{ctx.clearRect(0,0,cv.width,cv.height);
  g.forEach((r,y)=>r.forEach((v,xx)=>{if(v)cell(xx,y,v)}));
  if(!dead)p.m.forEach((r,y)=>r.forEach((v,xx)=>{if(v)cell(p.x+xx,p.y+y,p.k)}));
  if(dead){ctx.fillStyle="rgba(0,0,0,.6)";ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="bold 22px sans-serif";ctx.fillText("Game over",cv.width/2,cv.height/2-8);ctx.font="14px sans-serif";ctx.fillText("Press ⟳ or Space",cv.width/2,cv.height/2+18)}};
 const reset=()=>{g=Array.from({length:H},()=>Array(W).fill(0));score=0;lines=0;dead=false;spawn();info()};
 const loop=()=>{if(!dead){if(fit(p.m,p.x,p.y+1))p.y++;else lock();draw();info()}t=setTimeout(loop,Math.max(90,600-Math.floor(lines/10)*50))};
 gkey=k=>{
  if(dead){if(k==="ArrowUp"||k===" "||k==="Enter"||k==="tap"){reset();draw()}return}
  if(k==="ArrowLeft"&&fit(p.m,p.x-1,p.y))p.x--;
  else if(k==="ArrowRight"&&fit(p.m,p.x+1,p.y))p.x++;
  else if(k==="ArrowDown"){if(fit(p.m,p.x,p.y+1)){p.y++;score++}}
  else if(k==="ArrowUp"){const r=rot(p.m);for(const dx of[0,-1,1,-2,2])if(fit(r,p.x+dx,p.y)){p.m=r;p.x+=dx;break}}
  else if(k===" "){while(fit(p.m,p.x,p.y+1)){p.y++;score+=2}lock()}
  else return;
  draw();info()};
 gstop=()=>clearTimeout(t);
 reset();draw();loop();
}

function gChess(box,setS){
 const FEN="rnbqkbnrpppppppp"+"8888"+"PPPPPPPPRNBQKBNR",GL={p:"♟",r:"♜",n:"♞",b:"♝",q:"♛",k:"♚"},VAL={p:100,n:320,b:330,r:500,q:900,k:0};
 let b,turn,sel,legal,over,last,alive=true;
 const isW=c=>c===c.toUpperCase(),col=c=>c?(isW(c)?"w":"b"):"";
 const gen=(bd,i)=>{const c=bd[i],t=c.toLowerCase(),w=isW(c),r=i>>3,f=i&7,out=[];
  const add=(rr,ff,mode)=>{if(rr<0||rr>7||ff<0||ff>7)return false;const j=rr*8+ff,o=bd[j];if(o&&col(o)===col(c))return false;if(mode===1&&!o)return false;if(mode===2&&o)return false;out.push(j);return !o};
  if(t==="p"){const d=w?-1:1;if(add(r+d,f,2)&&r===(w?6:1))add(r+2*d,f,2);add(r+d,f-1,1);add(r+d,f+1,1)}
  else if(t==="n")[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]].forEach(([a,e])=>add(r+a,f+e));
  else if(t==="k"){for(let a=-1;a<=1;a++)for(let e=-1;e<=1;e++)if(a||e)add(r+a,f+e)}
  else{const dirs=[];if(t!=="b")dirs.push([1,0],[-1,0],[0,1],[0,-1]);if(t!=="r")dirs.push([1,1],[1,-1],[-1,1],[-1,-1]);
   for(const[a,e]of dirs)for(let k=1;k<8;k++)if(!add(r+a*k,f+e*k))break}
  return out};
 const inChk=(bd,c)=>{const k=bd.indexOf(c==="w"?"K":"k");return bd.some((p,i)=>p&&col(p)!==c&&gen(bd,i).includes(k))};
 const promo=(bd,i,j)=>{const nb=[...bd];nb[j]=nb[i];nb[i]="";if(nb[j]==="P"&&j<8)nb[j]="Q";if(nb[j]==="p"&&j>55)nb[j]="q";return nb};
 const lf=(bd,i)=>gen(bd,i).filter(j=>!inChk(promo(bd,i,j),col(bd[i])));
 const anyL=(bd,c)=>bd.some((p,i)=>p&&col(p)===c&&lf(bd,i).length>0);
 const mv=(i,j)=>{b=promo(b,i,j);last=[i,j];turn=turn==="w"?"b":"w";
  if(!anyL(b,turn))over=inChk(b,turn)?(turn==="w"?"Checkmate. The computer wins.":"Checkmate. You win! 🎉"):"Stalemate. It’s a draw."};
 const ev=bd=>bd.reduce((s,p)=>p?s+(isW(p)?-1:1)*VAL[p.toLowerCase()]:s,0);
 const cpu=()=>{let best=null,bs=-1e9;
  b.forEach((p,i)=>{if(!p||col(p)!=="b")return;lf(b,i).forEach(j=>{const nb=promo(b,i,j);let worst=ev(nb);
   nb.forEach((q,a)=>{if(q&&col(q)==="w")gen(nb,a).forEach(c=>{const v=ev(promo(nb,a,c));if(v<worst)worst=v})});
   let sc=worst+Math.random()*12;if(inChk(nb,"w")&&!anyL(nb,"w"))sc+=5000;if(sc>bs){bs=sc;best=[i,j]}})});
  if(best)mv(best[0],best[1])};
 const render=()=>{
  const chk=!over&&inChk(b,turn);
  setS(over||(turn==="w"?(chk?"Check! Your move":"Your move (white)"):"Computer is thinking…"));
  box.innerHTML=`<div class="cb">${b.map((p,i)=>{const dark=((i>>3)+(i&7))%2,hl=i===sel?"inset 0 0 0 4px #0f9d73":last&&last.includes(i)?"inset 0 0 0 3px rgba(232,164,0,.85)":"",w=p&&isW(p);
   return `<button data-s="${i}" style="background:${dark?"#b58863":"#eed9b6"};${hl?`box-shadow:${hl};`:""}"><span style="color:${w?"#fff":"#111"};text-shadow:${w?"0 0 3px #000,0 0 1px #000":"0 0 1px #888"}">${p?GL[p.toLowerCase()]+"\uFE0E":""}</span>${legal.includes(i)?'<i class="dt"></i>':""}</button>`}).join("")}</div><button class="ghost" data-newg>New game</button><small>You play white. No castling or en passant; pawns promote to queens.</small>`};
 const reset=()=>{b=[];for(const ch of FEN){if(ch>="1"&&ch<="8"){for(let n=0;n<+ch;n++)b.push("")}else b.push(ch)}turn="w";sel=null;legal=[];over="";last=null;render()};
 box.onclick=e=>{const bt=e.target.closest("button");if(!bt)return;const dd=bt.dataset;
  if("newg" in dd){reset();return}
  if(dd.s===undefined||over||turn!=="w")return;const i=+dd.s;
  if(sel!==null&&legal.includes(i)){mv(sel,i);sel=null;legal=[];render();if(!over)setTimeout(()=>{if(!alive)return;cpu();render()},300);return}
  if(b[i]&&col(b[i])==="w"){sel=i;legal=lf(b,i)}else{sel=null;legal=[]}
  render()};
 gstop=()=>{alive=false;box.onclick=null};
 reset();
}

function gTtt(box,setS){
 const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
 let b,turn,two=false,w={x:0,o:0,d:0};
 const win=bd=>{for(const[a,c,e]of L)if(bd[a]&&bd[a]===bd[c]&&bd[a]===bd[e])return bd[a];return bd.every(Boolean)?"d":""};
 const mm=(bd,p)=>{const r=win(bd);if(r)return r==="o"?1:r==="x"?-1:0;let best=p==="o"?-2:2;
  for(let i=0;i<9;i++)if(!bd[i]){bd[i]=p;const v=mm(bd,p==="o"?"x":"o");bd[i]="";best=p==="o"?Math.max(best,v):Math.min(best,v)}return best};
 const cpu=()=>{const em=[...Array(9).keys()].filter(i=>!b[i]);if(Math.random()<.2)return em[Math.floor(Math.random()*em.length)];
  let bv=-2,bm=[];for(const i of em){b[i]="o";const v=mm(b,"x");b[i]="";if(v>bv){bv=v;bm=[i]}else if(v===bv)bm.push(i)}return bm[Math.floor(Math.random()*bm.length)]};
 const render=()=>{const r=win(b);
  box.innerHTML=`<div class="ttt">${b.map((v,i)=>`<button data-c="${i}" ${v||r?"disabled":""}>${v?v.toUpperCase():""}</button>`).join("")}</div><b>${r==="d"?"It’s a draw":r?(two?r.toUpperCase()+" wins!":r==="x"?"You win! 🎉":"Computer wins"):(two?turn.toUpperCase()+"’s turn":"Your turn (X)")}</b><div class="row" style="width:min(100%,300px)"><button class="ghost" data-tn>New game</button><button class="ghost" data-tm>${two?"Play the computer":"Two players"}</button></div>`;
  setS(two?`X ${w.x} · O ${w.o} · Draws ${w.d}`:`You ${w.x} · Computer ${w.o} · Draws ${w.d}`)};
 const reset=()=>{b=Array(9).fill("");turn="x";render()};
 box.onclick=e=>{const bt=e.target.closest("button");if(!bt)return;const d=bt.dataset;
  if("tn" in d)return reset();
  if("tm" in d){two=!two;w={x:0,o:0,d:0};return reset()}
  if(d.c===undefined||win(b))return;const i=+d.c;if(b[i])return;
  b[i]=turn;turn=turn==="x"?"o":"x";
  if(!two&&!win(b)&&turn==="o"){b[cpu()]="o";turn="x"}
  const r=win(b);if(r)w[r]++;render()};
 gstop=()=>{box.onclick=null};
 reset();
}

// ---- types and evolutions
const TYPES=["normal","fire","water","electric","grass","ice","fighting","poison","ground","flying","psychic","bug","rock","ghost","dragon","dark","steel","fairy"],
 TCOL={normal:"#9a9a82",fire:"#e8602c",water:"#4a8de8",electric:"#d9a900",grass:"#4caf50",ice:"#58c6d1",fighting:"#c03028",poison:"#a040a0",ground:"#c9a54a",flying:"#8a7be0",psychic:"#f85888",bug:"#8fa818",rock:"#a8903a",ghost:"#705898",dragon:"#6f35fc",dark:"#6a5648",steel:"#8e8ea8",fairy:"#e87ca0"};
const tb=t=>`<span class="rar" style="background:${TCOL[t]||"#888"}">${esc(t)}</span>`,tbs=a=>(a||[]).map(tb).join(""),typeOpts=()=>TYPES.map(t=>`<option>${t}</option>`).join("");
// status effects shown in battles
const SEM={poison:"☠️",burn:"🔥",paralysis:"⚡",sleep:"💤",freeze:"🧊"},SCOL={poison:"#a040a0",burn:"#e8602c",paralysis:"#d9a900",sleep:"#6b678a",freeze:"#58c6d1"},
 AUTO={fire:"burn",poison:"poison",electric:"paralysis",ice:"freeze",psychic:"sleep",grass:"sleep"};
const stOf=k=>{if(!k||!k.id||k.st==="none"||k.heal>0)return null;if(SEM[k.st])return{s:k.st,c:k.sc>0?k.sc:30};const a=AUTO[k.type||"normal"];return a?{s:a,c:20}:null};
const stTag=k=>{const s=stOf(k);return s?` · ${SEM[s.s]} ${s.c}%`:""};
const stCur=f=>f.team&&f.team[f.cur];
const stBadge=f=>{const c=stCur(f),s=c&&c.st;return s?`<span class="rar" style="background:${SCOL[s]}">${SEM[s]} ${s}</span>`:""};
const stCls=f=>{const c=stCur(f);return c&&c.st?" st-"+c.st:""};

 $("#evbody").innerHTML=`<b>${esc(c.name)} evolves…</b><label>At level<input id="evlvl" type="number" min="2" max="100" value="${cur.lvl}"></label><b>Into (tick several for a choice, up to 10)</b>`
  +(Object.values(cats).filter(o=>o.id!==c.id&&!o.owner).map(o=>`<label style="display:flex;gap:.5rem;align-items:center"><input type="checkbox" data-evto="${o.id}" style="width:auto" ${cur.to.includes(o.id)?"checked":""}>${esc(o.name)} ${tbs(o.t)}</label>`).join("")||"<small>Create the evolved cats first.</small>");
 $("#evdlg").showModal()}
$("#evdlg").onclick=async e=>{const b=e.target.closest("button");if(!b||!evc)return;const d=b.dataset;
 try{

 }catch(x){}
};
